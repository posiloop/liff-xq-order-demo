<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>享奇雞 彙整分配</title>
<style>
  :root{
    --bg:#f5f5f3; --card:#fff; --line:#e0ddd8; --ink:#1c1c1c; --muted:#6b6b6b;
    --brand:#0f7b3f; --brand-soft:#eef7f1; --ok:#0f7b3f; --bad:#b42318; --warn:#b06a00;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* 同叫貨／進貨／調撥頁：連點輸入框不要觸發「連點兩下＝放大」（軒徹 msg24534）。
     ⛔ 不要改用 maximum-scale／user-scalable=no，那是把整頁縮放關掉。 */
  button,input,select,summary{touch-action:manipulation}
  html,body{max-width:100%;overflow-x:hidden}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"PingFang TC","Heiti TC","Noto Sans CJK TC",system-ui,sans-serif;
       font-size:16px;line-height:1.55;padding-bottom:130px}
  header{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;
         padding:calc(env(safe-area-inset-top) + 12px) 14px 12px}
  header .t{font-weight:700;font-size:17px}
  header .t small{display:block;font-weight:400;opacity:.92;font-size:12.5px}
  main{padding:12px}

  /* 🔴 這條橫幅是**功能的一部分，不是裝飾**：這一版按下去不會寫進任何表。
     沒有它，使用者按完看不到帳有變，只能自己猜是「壞了」還是「還沒做」。 */
  .phase{background:#fff7e6;border:1px solid #f0d9a8;color:#7a4b00;border-radius:10px;
         padding:10px 12px;font-size:13px;line-height:1.6;margin-bottom:10px}
  /* 🔴 示範模式要**一眼看得出來**：示範列跟真列長一樣時，人就會拿示範算出來的
     數字去做真的採購決定。⛔ 不要為了畫面乾淨把它改成小小一行灰字。 */
  .demo{background:#fdf2f1;border:1.5px solid var(--bad);color:var(--bad);border-radius:10px;
        padding:10px 12px;font-size:13.5px;font-weight:700;line-height:1.6;margin-bottom:10px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
        margin-bottom:10px;overflow:hidden}
  .card h3{font-size:14.5px;padding:11px 12px;background:#f7f6f4;color:#444;font-weight:700;
           border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
  .card h3 .sup{color:var(--muted);font-weight:600;font-size:12.5px}
  .pad{padding:12px}

  /* 品項是分組單位（軒徹 msg25615「同品項應該相鄰」）：標頭一次、底下逐店一行。 */
  .item{border-top:1px solid var(--line)}
  .item:first-of-type{border-top:0}
  .item .ih{display:flex;align-items:baseline;gap:8px;padding:9px 12px 0}
  .item .ih .nm{font-weight:700;font-size:15px}
  .item .ih .sp{font-size:12.5px;color:var(--muted)}
  .item .im{font-size:12.5px;color:var(--muted);padding:0 12px 8px}
  .item .im b{color:var(--ink)}

  /* 一行＝一家店。左：店別　中：叫貨量　右：兩個數字框＋合計。
     🔴 店別欄固定寬度 ⇒ 上下對齊得起來；店名長度不一時不用固定寬的話，
        每一行的數字框會各自對在不同位置，整欄就看不成一欄。 */
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
       border-top:1px dashed var(--line);padding:8px 12px}
  .row .who{font-size:13.5px;font-weight:700;width:96px;flex:0 0 96px}
  .row .qty{font-size:12.5px;color:var(--muted);width:76px;flex:0 0 76px}
  .row .qty b{color:var(--ink);font-size:14px}
  .row .md{font-size:12px;color:var(--muted)}
  .row .in{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .row .lb{font-size:12.5px;color:var(--muted);font-weight:600}
  /* 🔴 font-size 必須 >=16px：iOS Safari 對小於 16px 的輸入框會自動放大整頁。 */
  input[type=number]{font-size:16px;border:1.5px solid var(--line);border-radius:8px;
                     background:#fff;padding:9px 2px;width:70px;text-align:center}
  .row.bad input[type=number]{border-color:var(--bad);background:#fdf2f1}
  .tally{font-size:13px;font-weight:700;margin-left:auto}
  .tally.ok{color:var(--ok)} .tally.bad{color:var(--bad)} .tally.short{color:var(--warn)}
  .row.short input[type=number]{border-color:var(--warn);background:#fff9ee}

  /* 兩大區（軒徹 msg25597）。用 <details> 而不是自己寫展開：
     鍵盤、螢幕閱讀器、瀏覽器的「頁內尋找」都認得它，自幹的 div 都不認得。 */
  .sec{margin-bottom:12px}
  .sec>summary{list-style:none;cursor:pointer;background:var(--card);border:1px solid var(--line);
               border-radius:12px;padding:11px 12px;font-size:15px}
  .sec>summary::-webkit-details-marker{display:none}
  .sec>summary::after{content:"▶";float:right;font-size:12px;color:var(--muted);margin-top:3px}
  .sec[open]>summary::after{content:"▼"}
  .sec>summary .cnt{color:var(--muted);font-size:12.5px;font-weight:600;margin-left:8px}
  .sec>summary .sub{color:var(--muted);font-size:12.5px;font-weight:400;margin-top:2px}
  .sec[open]>summary{border-radius:12px 12px 0 0;border-bottom:0}
  .sec .card{border-radius:0;border-top:0;margin-bottom:0}
  .sec .card:last-child{border-radius:0 0 12px 12px}
  .unk{display:inline-block;background:#fff7e6;border:1px solid #f0d9a8;color:#7a4b00;
       border-radius:6px;font-size:11.5px;padding:1px 6px;margin-left:6px;font-weight:700}

  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
       padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);z-index:30}
  .bar button{width:100%;border:0;border-radius:10px;background:var(--brand);color:#fff;
              font-size:16.5px;font-weight:700;padding:13px}
  .bar button[disabled]{background:#b9c7bf}
  .bar button + button{margin-top:8px}
  /* 🔴 送出鈕**故意跟試算鈕不同色**：兩顆一樣的話，按錯的那一顆是不可逆的那一顆。 */
  .bar button.danger{background:var(--bad)}
  .msg{border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.6;margin-bottom:10px}
  .msg.bad{background:#fdf2f1;border:1px solid #f3c9c4;color:var(--bad)}
  .msg.warn{background:#fff7e6;border:1px solid #f0d9a8;color:#7a4b00}
  .msg.ok{background:var(--brand-soft);border:1px solid #bfe0cd;color:var(--ok)}
  .msg ul{margin:6px 0 0;padding-left:18px}
  .empty{padding:26px 14px;text-align:center;color:var(--muted);font-size:14px;line-height:1.8}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:8px 12px;border-top:1px solid var(--line);text-align:left}
  th{background:#faf9f7;color:var(--muted);font-size:12.5px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<header>
  <div class="t">🧮 彙整分配
    <small id="sub">載入中…</small>
  </div>
</header>

<main>
  <!-- 🔴 這段是**功能的一部分，不是裝飾**：它界定「按下去會發生什麼」。
       2026-09-21 軒徹 msg25674「先接起來」之後，這頁有兩顆按鈕、兩種後果，
       ⛔ 不可以再用舊的那句「按下去只會算給你看」一概而論 —— 那句現在只對「試算」成立。 -->
  <div class="phase">
    <b>試算看看</b>：只算給你看，一格都不寫。<br>
    <b>送出配單</b>：出 PDF（廠商採購單＋中轉調撥單），並把這批單轉成「<b>已核可</b>」
    ——<b>配單完成就是核可</b>，轉完它們就離開這個待配清單。<br>
    ⚠️ 採購單總表、調撥明細、應收明細<b>仍然還沒寫</b>，送出後畫面上會逐項告訴你哪幾張沒寫、為什麼。
  </div>
  <div id="demo"></div>
  <div id="msg"></div>
  <div id="body"></div>
  <div id="result"></div>
</main>

<!-- 🔴 送出鈕預設**不存在於可按狀態**，要試算全綠才出現（`showResult` 開它）。
     ⛔ 不要一開始就給一顆可按的「送出」：後端雖然也會自己擋（`_commit_docs` 先跑一次
     試算，不 ok 就 raise），但讓人按得下去再被拒絕，等於把「你還沒填對」演成一次失敗。 -->
<div class="bar">
  <button id="go" onclick="preview()" disabled>試算看看</button>
  <button id="commit" class="danger" onclick="commit()" hidden>送出配單（＝核可）</button>
</div>

<script>
/* 後端入口。⛔ 與 apply／receiving／transfer 同一個值、同一個來源；
   分岔的話這頁會安靜地打到別的環境。 */
var ENDPOINT = "https://hook.aemassinc.net/xq";
function qs(k){
  var m = new RegExp("[?&]"+k+"=([^&]*)").exec(window.location.search);
  return m ? decodeURIComponent(m[1].replace(/\+/g," ")) : "";
}
var Q_UID = qs("u"), Q_SIG = qs("s"), Q_DAY = qs("day"), Q_DEMO = (qs("demo") === "1");
var DATA = null;

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function say(html, cls){
  document.getElementById("msg").innerHTML = cls ? '<div class="msg '+cls+'">'+html+'</div>' : "";
}

/* 🔴 列的識別一律用後端給的 `key`（供應商|店|貨號），⛔ 不用畫面上的列序：
   使用者填到一半重新整理、或後端多出一張單，列序就會換，數字會填到別人身上。 */
function rowEl(k, which){ return document.getElementById(which+"__"+k); }

function load(){
  if(!Q_UID || !Q_SIG){
    say("這個連結少了身分資訊。請從 LINE 的選單重新點一次，不要直接貼網址。", "bad");
    document.getElementById("sub").textContent = "沒有身分資訊";
    return;
  }
  var url = ENDPOINT+"/allocate?u="+encodeURIComponent(Q_UID)+"&s="+encodeURIComponent(Q_SIG)
          + (Q_DAY ? "&day="+encodeURIComponent(Q_DAY) : "")
          + (Q_DEMO ? "&demo=1" : "");
  fetch(url).then(function(r){ return r.json(); }).then(function(d){
    /* 🔴 後端回 `ok:false` 是「講得出原因的拒絕」（沒權限／清單變了），
       ⛔ 不要跟網路錯誤混成同一句話：一個是使用者要處理的，一個是我要處理的。 */
    if(!d || !d.ok){ say(esc((d && d.error) || "讀不到資料"), "bad");
                     document.getElementById("sub").textContent = "讀不到"; return; }
    DATA = d;
    render();
  }).catch(function(e){
    say("連不上系統（"+esc(e.message || e)+"）。這是連線問題，不是你填錯。", "bad");
    document.getElementById("sub").textContent = "連不上";
  });
}

function render(){
  var d = DATA;
  /* 🔴 印 `day_label` 不印 `day`：不分日期時 `day` 的值是機器用的 "all"，
     直接印會在標題列出現一個沒人看得懂的英文字。`day` 只負責原樣送回後端。 */
  document.getElementById("sub").textContent =
    (d.day_label || d.day) + "　共 " + d.orders + " 張店家單、" + d.rows.length + " 列";
  /* 🔴 示範橫幅插在「試算」橫幅**之前**：兩件事要分開講 ——
     「不會寫進表」是這一版的限制，「數字是假的」是這一次的資料。 */
  document.getElementById("demo").innerHTML = d.demo
    ? '<div class="demo">⚠️ 這是<u>示範單</u>：叫貨量照你 09-20 那張〈各店明細〉，'
      + '供應商與中轉倉庫存是現查的真值 —— <b>假的只有「有這批單」這件事</b>，'
      + '不是今天真的叫貨單。要看真的把網址後面的 <code>&amp;demo=1</code> 拿掉。</div>'
    : "";
  if(!d.rows.length){
    /* 🔴 這段文案 2026-09-21 改過：舊版寫「你核可過之後這裡才會有東西」，**是錯的**，
       而且錯的方向最傷 —— 配單本身就是核可（軒徹 msg25666），照舊文案去等一個
       不存在的核可動作，人就會一直盯著一個永遠不會變的空畫面。
       ⛔ 不要再把這裡寫成「已核可」。 */
    document.getElementById("body").innerHTML =
      '<div class="card"><div class="empty">沒有<b>還沒配單</b>的 LIFF 叫貨單。<br>'
      + '店家用 LIFF 送出之後就會出現在這裡；<b>配完單</b>的會轉成「已核可」並離開這個清單。'
      + '<br><span class="sp">（網址沒帶 day＝看全部；帶 day=YYYYMMDD＝只看那一天）</span>'
      + '</div></div>';
    document.getElementById("go").disabled = true;
    document.getElementById("commit").hidden = true;
    return;
  }
  /* 🔴 兩大區（軒徹 msg25597）：**可拆單**＝中轉倉真的有庫存的；其餘只能決定轉不轉採購。
     ⛔ 不要把「倉裡沒有」的也給一個中轉輸入框 —— 填得下去卻出不來，比不給更糟。 */
  var yes = d.rows.filter(function(r){ return r.splittable; });
  var no  = d.rows.filter(function(r){ return !r.splittable; });
  document.getElementById("body").innerHTML =
      section("split", "可拆單", "中轉倉有庫存，可以決定幾包從倉裡出", yes, true)
    + section("nosplit", "不可拆單", "中轉倉沒有庫存，只能決定轉不轉採購", no, false);
  afterRender(d);
}

/* 一個區塊。`open` ＝預設展開。
   外層逐供應商（採購單是按供應商出的），**內層逐品項**。

   🔴 分組鍵是**品項**，不是店（軒徹 msg25615：「同品項應該相鄰　這樣我才好配」）。
      ⛔ 不要改回逐店分組 —— 他要做的決定是「這個品項總共 540 包、倉裡 288，
      哪幾家從倉裡出」，那是一個**跨店**的決定；按店排等於逼他自己在腦袋裡把同一個品項
      從七個地方撿回來，而超領判定本來就是按品項跨店合計算的。
   📌 品項資訊（規格／配送邏輯／倉存／各店合計）提到**品項標頭**，逐列就不再重複印一次，
      這樣每一列才排得成「店別 → 數字」一行（msg25615 的第二句）。 */
function section(id, title, sub, rows, open){
  if(!rows.length) return "";
  var bySup = {}, supOrder = [];
  rows.forEach(function(r){
    if(!bySup[r.supplier_code]){ bySup[r.supplier_code] = []; supOrder.push(r.supplier_code); }
    bySup[r.supplier_code].push(r);
  });
  var h = '<details class="sec" id="sec__'+id+'"'+(open ? " open" : "")+'>'
        + '<summary><b>'+esc(title)+'</b><span class="cnt">'+rows.length+' 列</span>'
        + '<div class="sub">'+esc(sub)+'</div></summary>';
  supOrder.forEach(function(code){
    var rs = bySup[code];
    h += '<div class="card"><h3><span>'+esc(rs[0].supplier_name)+'</span>'
      +  '<span class="sup">'+esc(code)+'　'+rs.length+' 列</span></h3>';
    var byItem = {}, itemOrder = [];
    rs.forEach(function(r){
      if(!byItem[r.item_code]){ byItem[r.item_code] = []; itemOrder.push(r.item_code); }
      byItem[r.item_code].push(r);
    });
    itemOrder.forEach(function(ic){ h += itemHtml(byItem[ic]); });
    h += '</div>';
  });
  return h + "</details>";
}

/* 一個品項（同一家供應商底下）＝標頭 ＋ 逐店一行。 */
function itemHtml(rs){
  var r0 = rs[0];
  var sum = 0;
  rs.forEach(function(r){ sum += r.qty; });
  /* 🔴 倉存要跟「這本帳沒記過」分開講（後端回 null 就是後者）。
     ⛔ 不可以把 null 印成 0 —— 那會讓他以為倉裡真的空了。 */
  var stockTxt = (r0.stock === null || r0.stock === undefined)
      ? '<span class="unk">這本帳沒記過這個品項</span>'
      : ('中轉倉現有 <b>'+r0.stock+'</b> '+esc(r0.unit));
  /* 配送邏輯是（供應商 × 店）的屬性 ⇒ 同一個品項底下各店**可能不一樣**。
     ⛔ 不可以拿第一列的值當成整個品項的值（那會把「代收」印成「中轉」）：
        一致才提到標頭，不一致就退回逐列印。 */
  var modes = {}; rs.forEach(function(r){ modes[r.mode || ""] = 1; });
  var mk = Object.keys(modes), oneMode = (mk.length === 1);
  var h = '<div class="item">'
    +   '<div class="ih"><span class="nm">'+esc(r0.name)+'</span>'
    +     '<span class="sp">'+esc(r0.spec)+'</span></div>'
    +   '<div class="im">各店合計叫貨 <b>'+sum+'</b> '+esc(r0.unit)
    +     '　·　'+stockTxt
    +     (oneMode ? '　·　配送邏輯：'+esc(mk[0] || "（空白）") : "")
    +   '</div>';
  rs.forEach(function(r){ h += rowHtml(r, oneMode); });
  return h + '</div>';
}

/* 一列＝一家店。版型照採購單：**店別在前、品項資訊在中間（已提到標頭）、數字在後**
   （軒徹 msg25615）。⛔ 不要把品名塞回這一行 —— 同品項相鄰時，每列再印一次品名
   會讓「哪裡換品項了」反而看不出來。 */
function rowHtml(r, modeInHeader){
  var h = '<div class="row" id="row__'+esc(r.key)+'">'
    +   '<span class="who">'+esc(r.store_name)+'</span>'
    +   '<span class="qty">叫貨 <b>'+r.qty+'</b></span>';
  if(!modeInHeader){
    h += '<span class="md">'+esc(r.mode || "（空白）")+'</span>';
  }
  if(r.unknown_mode){ h += '<span class="unk">ERP 沒設定</span>'; }
  h += '<span class="in">'
    +    '<span class="lb">轉採購</span>'
    +    '<input type="number" inputmode="decimal" min="0" id="direct__'+esc(r.key)+'"'
    +      ' value="'+r.direct+'" oninput="tally(\''+esc(r.key)+'\')">';
  if(r.splittable){
    h += '<span class="lb">中轉調撥</span>'
      +  '<input type="number" inputmode="decimal" min="0" id="transit__'+esc(r.key)+'"'
      +    ' value="'+r.transit+'" oninput="tally(\''+esc(r.key)+'\')">';
  }
  return h + '</span><span class="tally" id="tally__'+esc(r.key)+'"></span></div>';
}

/* 開頁之後要做的收尾：逐列對一次帳、開按鈕、把「我沒算進去的東西」講出來。 */
function afterRender(d){
  d.rows.forEach(function(r){ tally(r.key); });
  document.getElementById("go").disabled = !d.rows.length;
  /* 🔴 `skipped` / `undated` 是「我沒算進去的東西」，一定要顯示出來。
     那幾列從畫面上消失時，看起來跟「本來就沒有」一模一樣。 */
  var notes = [];
  if(d.unknown){
    notes.push("有 "+d.unknown+" 列在 ERP〈配送邏輯〉沒有設定（空白或 X），請確認過再送。");
  }
  if(d.undated){
    /* 🔴 同一個 `undated` 在兩種模式下意思相反，⛔ 不可共用一句文案：
       指定某一天時它是「無從歸屬所以被排除」；不分日期時它**有**算進來
       （它確實是一張還沒配單的單）。講錯的那一版會讓他以為有單漏掉而去別處找。 */
    notes.push(d.day === "all"
      ? "有 "+d.undated+" 張單的日期我讀不懂，<b>已經算進這一頁</b>（不分日期時不會因為日期把單丟掉）。"
      : "有 "+d.undated+" 張單的日期我讀不懂，<b>沒有算進這一頁</b>；"
        + "把網址的 <code>day=</code> 拿掉就看得到它們。");
  }
  if(d.skipped && d.skipped.length){
    notes.push("下面這 "+d.skipped.length+" 列<b>沒有算進這一頁</b>："
             + "<ul>"+d.skipped.map(function(s){ return "<li>"+esc(s)+"</li>"; }).join("")+"</ul>");
  }
  say(notes.join("<br>"), notes.length ? "warn" : "");
}

/* 每一列即時對帳。🔴 只改畫面，不擋輸入：
   擋住輸入的話使用者沒辦法「先填一邊再填另一邊」，中間狀態本來就會不相等。 */
function cell(k, which){
  /* 不可拆單那些列**沒有**中轉那個框。⛔ 不要用 `.value` 硬讀 —— 讀 null 會丟例外，
     而這支綁在 oninput 上，丟了例外就是「打字沒反應」而且 console 以外看不到。 */
  var e = rowEl(k, which);
  if(!e) return 0;
  var v = parseFloat(e.value);
  return isNaN(v) ? 0 : v;
}

function tally(k){
  /* 🔴 一改數字就把送出鈕收回去：綠燈是「上一次試算」給的，數字換了那盞燈就過期了。
     ⛔ 不可以只靠後端擋 —— 後端擋得住錯的，擋不住「他以為他送出的是剛剛看到的那一版」。 */
  setCommitReady(false);
  var r = DATA.rows.filter(function(x){ return x.key === k; })[0];
  if(!r) return;
  var got = cell(k,"direct") + (r.splittable ? cell(k,"transit") : 0);
  var t = document.getElementById("tally__"+k), row = document.getElementById("row__"+k);
  /* 🔴 三態，不是兩態（軒徹 msg25597「轉 or 不轉採購」）：
     少於叫貨量是**他可能故意的**，所以不是紅色的錯，而是橘色的「這家店會短收」；
     多於叫貨量才是紅色。兩態的話「他故意少買」跟「他打錯」會長成同一個顏色。 */
  var state = (Math.abs(got - r.qty) < 0.001) ? "ok" : (got > r.qty ? "bad" : "short");
  t.className = "tally " + state;
  t.textContent = state === "ok" ? ("＝ " + r.qty)
                : state === "bad" ? (got + " / " + r.qty + "　太多")
                : (got + " / " + r.qty + "　短 " + round3(r.qty - got));
  row.className = "row" + (state === "bad" ? " bad" : (state === "short" ? " short" : ""));
}

function round3(n){ return Math.round(n * 1000) / 1000; }

function currentLines(){
  return DATA.rows.map(function(r){
    return {key: r.key,
            direct: cell(r.key,"direct"),
            /* 不可拆單的列永遠送 0：那些列畫面上根本沒有中轉框。 */
            transit: r.splittable ? cell(r.key,"transit") : 0};
  });
}

function preview(){
  var lines = currentLines();
  var btn = document.getElementById("go");
  btn.disabled = true; btn.textContent = "算…";
  fetch(ENDPOINT+"/allocate-preview", {method:"POST",
        headers:{"Content-Type":"application/json"},
        /* 🔴 `demo` 跟著送回去，⛔ 不要讓後端從 day 反推 —— 那是拿顯示字串當旗標。 */
        body: JSON.stringify({u:Q_UID, s:Q_SIG, day:DATA.day,
                              demo: !!DATA.demo, lines:lines})})
    .then(function(r){ return r.json(); })
    .then(function(d){ showResult(d); })
    .catch(function(e){
      say("連不上系統（"+esc(e.message || e)+"）。", "bad");
    })
    .then(function(){ btn.disabled = false; btn.textContent = "試算看看"; });
}

/* 🔴 送出鈕的開關只看「這一次試算的結果」，⛔ 不記憶上一次：
   使用者改了數字沒重算就按送出，送出的會是新數字、而綠燈是舊數字給的。
   所以每次進 `showResult` 都重設，而且**任何一次改輸入都要再關掉**（見 afterRender）。 */
function setCommitReady(ok){
  var b = document.getElementById("commit");
  b.hidden = !ok;
  b.disabled = !ok;
}

function showResult(d){
  if(d.error){ setCommitReady(false); say(esc(d.error), "bad"); return; }
  setCommitReady(!!d.ok);
  var h = "";
  /* 🔴 短收自己一格、用橘色：那不是「錯」，是他可能故意的決定（「不轉採購」），
     但後果是店家收不到東西 ⇒ ⛔ 不可以混在其他警告裡一起帶過。 */
  if(d.shortfalls && d.shortfalls.length){
    h += '<div class="msg warn"><b>這幾列有東西沒有來源，店家會短收：</b><ul>'
      +  d.shortfalls.map(function(w){ return "<li>"+esc(w)+"</li>"; }).join("")
      +  '</ul>確定是故意的就繼續，不是的話把數字補回去。</div>';
  }
  var rest = (d.warnings || []).filter(function(w){
    return (d.shortfalls || []).indexOf(w) < 0;   /* 短收已經單獨列過，不重複 */
  });
  if(rest.length){
    h += '<div class="msg '+(d.ok ? "warn" : "bad")+'">'
      /* 🔴 標題不要寫死成「數字兜不攏」：擋人的原因不只一種（兜不攏、中轉倉超領、
         倉裡沒記過這個品項…）。把所有原因講成同一個，人就會照著那句話去找錯的地方。 */
      +  (d.ok ? "算出來了，但有幾件要你確認：" : "<b>還不能送</b>，下面這幾件要先處理：")
      +  "<ul>" + rest.map(function(w){ return "<li>"+esc(w)+"</li>"; }).join("") + "</ul>"
      +  '</div>';
  }
  if(d.ok){
    h += '<div class="msg ok">'+esc(d.note)+'</div>';
    h += '<div class="card"><h3><span>跟廠商買（採購單）</span></h3>';
    if(!d.purchase.length){ h += '<div class="empty">這次沒有要跟廠商買的東西。</div>'; }
    d.purchase.forEach(function(b){
      h += '<table><thead><tr><th>'+esc(b.supplier_name)+'</th><th class="num">數量</th></tr></thead><tbody>';
      b.items.forEach(function(i){
        h += "<tr><td>"+esc(i.name)+'　<span class="sp">'+esc(i.spec)+"</span></td>"
          +  '<td class="num">'+i.qty+" "+esc(i.unit)+"</td></tr>";
      });
      h += "</tbody></table>";
    });
    h += "</div>";
    h += '<div class="card"><h3><span>從中轉倉調出（調撥單）</span>'
      +  '<span class="sup">系統自己開，店家看不到</span></h3>';
    if(!d.transfer.length){ h += '<div class="empty">這次沒有要從中轉倉出的東西。</div>'; }
    d.transfer.forEach(function(b){
      h += '<table><thead><tr><th>中轉倉 → '+esc(b.store_name)+'</th><th class="num">數量</th></tr></thead><tbody>';
      b.items.forEach(function(i){
        h += "<tr><td>"+esc(i.name)+'　<span class="sp">'+esc(i.spec)+"</span></td>"
          +  '<td class="num">'+i.qty+" "+esc(i.unit)+"</td></tr>";
      });
      h += "</tbody></table>";
    });
    h += "</div>";
    if(d.untouched && d.untouched.length){
      h += '<div class="msg warn">有 '+d.untouched.length
        +  ' 列你沒有動過，照 ERP〈配送邏輯〉的預設算。<b>沒動過不等於 0</b>，'
        +  '所以那些量還是有買／有調。</div>';
    }
  }
  document.getElementById("result").innerHTML = h;
  document.getElementById("result").scrollIntoView({behavior:"smooth", block:"start"});
}

function commit(){
  /* 🔴 出單是不可逆的（PDF 會寄出去、單會變成已核可）⇒ 送出前**再問一次**。
     ⛔ 不要用 alert/confirm 以外的自製對話框省事，也⛔ 不要拿掉這一問：
     這頁唯一一個會改到表的動作就是它。 */
  var n = (DATA.order_nos || []).length;
  if(!window.confirm("要送出配單嗎？\n\n會出 PDF，並把這 " + n +
                     " 張單轉成「已核可」（配單完成＝核可），轉完它們就離開這個清單。")){
    return;
  }
  var btn = document.getElementById("commit");
  btn.disabled = true; btn.textContent = "出單中…（會花幾十秒，不要重按）";
  fetch(ENDPOINT+"/allocate-commit", {method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({u:Q_UID, s:Q_SIG, day:DATA.day,
                              demo: !!DATA.demo, lines:currentLines()})})
    .then(function(r){ return r.json(); })
    .then(function(d){ showCommit(d); })
    .catch(function(e){
      /* 🔴 連線斷掉時**不可以說「沒出單」**：請求可能已經到後端跑完了。
         講不確定的事要講成不確定的（[[R2]]：這是關於我這一側偵測的陳述）。 */
      say("連線中途斷了（"+esc(e.message || e)+"）。<b>我不知道那邊做完了沒有</b>——"
        + "重新整理這一頁，如果那幾張單不見了就是已經出單成功，不要重按。", "bad");
    })
    .then(function(){ btn.textContent = "送出配單（＝核可）"; });
}

function showCommit(d){
  if(!d || !d.ok){
    setCommitReady(true);   /* 失敗＝單還在佇列，讓他改完可以再送 */
    say(esc((d && d.error) || "出單失敗"), "bad");
    return;
  }
  setCommitReady(false);    /* 成功＝這批已離開佇列，⛔ 不可以讓他再按一次 */
  var h = "";
  var ap = d.approved || {};
  h += '<div class="msg ok"><b>出單完成。</b>'
    +  (ap.order_nos && ap.order_nos.length
        ? "這 "+ap.order_nos.length+" 張單（"+ap.order_nos.map(esc).join("、")
          +"）已轉成<b>已核可</b>，共改了 "+ap.rows+" 列，已離開待配清單。"
        : "（示範資料，沒有動到任何真的單。）")
    +  '</div>';
  h += '<div class="card"><h3><span>產生的單</span></h3>';
  (d.files || []).forEach(function(f){
    h += '<table><tbody><tr><td>'+esc(f.kind)+'　<span class="sp">'+esc(f.name)+'</span></td>'
      +  '<td class="num">'
      +  (f.url ? '<a href="'+esc(f.url)+'" target="_blank" rel="noopener">開啟</a>'
                /* 🔴 上傳失敗要講出來，⛔ 不可以給一個空連結假裝成功 */
                : '<span class="sp">上傳失敗：'+esc(f.upload_error || "不明")+'</span>')
      +  '</td></tr></tbody></table>';
  });
  if(!(d.files || []).length){ h += '<div class="empty">這次沒有產生任何單。</div>'; }
  h += '</div>';
  if(d.wrote && d.wrote.length){
    h += '<div class="msg ok"><b>已經寫進去的：</b><ul>'
      +  d.wrote.map(function(w){ return "<li>"+esc(w)+"</li>"; }).join("")+'</ul></div>';
  }
  /* 🔴 `not_written` **一定要顯示**：看到 PDF 出來，預設的理解就是帳也記了。 */
  if(d.not_written && d.not_written.length){
    h += '<div class="msg warn"><b>還沒寫進表的（要知道）：</b><ul>'
      +  d.not_written.map(function(w){ return "<li>"+esc(w)+"</li>"; }).join("")+'</ul></div>';
  }
  document.getElementById("result").innerHTML = h;
  document.getElementById("result").scrollIntoView({behavior:"smooth", block:"start"});
}

load();
</script>
</body>
</html>
