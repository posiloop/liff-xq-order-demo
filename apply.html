<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>享奇雞 叫貨 · 申請認證</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{
    --bg:#f5f5f3; --card:#fff; --line:#e0ddd8; --ink:#1c1c1c; --muted:#6b6b6b;
    --brand:#d97706; --brand-soft:#fff7e8; --ok:#0f7b3f; --bad:#b42318;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{max-width:100%;overflow-x:hidden}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"PingFang TC","Heiti TC","Noto Sans CJK TC",system-ui,sans-serif;
       font-size:16px;line-height:1.55;padding-bottom:40px}
  header{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;
         padding:calc(env(safe-area-inset-top) + 12px) 14px 12px}
  header .t{font-weight:700;font-size:17px}
  header .t small{display:block;font-weight:400;opacity:.9;font-size:12.5px}
  .demo-bar{background:#1c1c1c;color:#ffd48a;font-size:12.5px;padding:8px 12px;
            text-align:center;line-height:1.5}
  .demo-bar b{color:#fff}
  main{padding:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
        padding:14px;margin-bottom:12px}
  .h3{font-weight:700;font-size:15px;margin:0 0 8px}
  label{display:block;font-size:13.5px;color:var(--muted);margin:12px 0 4px}
  label:first-of-type{margin-top:0}
  select,input{width:100%;padding:11px 12px;font-size:16px;border:1px solid var(--line);
               border-radius:10px;background:#fff;color:var(--ink);font-family:inherit}
  select:focus,input:focus{outline:2px solid var(--brand);outline-offset:-1px}
  .note{color:var(--muted);font-size:13px;margin-top:8px}
  .err{color:var(--bad);font-size:13.5px;margin-top:8px;display:none}
  button.primary{width:100%;margin-top:16px;padding:14px;font-size:16px;font-weight:700;
                 color:#fff;background:var(--brand);border:0;border-radius:10px;cursor:pointer}
  button.primary:disabled{opacity:.5}
  .done{text-align:center;padding:26px 14px}
  .done .big{font-size:40px;line-height:1}
  .done h2{margin:10px 0 6px;font-size:18px}
  .screen{display:none}
  .screen.on{display:block}
  .kv{margin:14px 0 0;border-top:1px solid var(--line);padding-top:12px;text-align:left}
  .kv div{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:3px 0}
  .kv span:first-child{color:var(--muted)}
  .kv span:last-child{font-weight:600}
  .step{display:flex;align-items:center;gap:8px;font-size:14px;padding:6px 0;text-align:left}
  .step .dot{flex:0 0 18px;height:18px;border-radius:50%;background:var(--line);
             color:#fff;font-size:11px;line-height:18px;text-align:center;font-weight:700}
  .step.ok .dot{background:var(--ok)}
  .step.now .dot{background:var(--brand)}
  .step.now{font-weight:700}
  .step.todo{color:var(--muted)}
  .warn{background:var(--brand-soft);border:1px solid #f0d9a8;border-radius:10px;
        padding:12px;font-size:13.5px;margin-top:14px;text-align:left}
</style>
</head>
<body>

<header>
  <div class="t">申請認證<small>享奇雞 叫貨系統</small></div>
</header>

<div class="demo-bar" id="demoBar">
  <span id="bannerTxt"><b>這頁還沒掛進 LINE</b>·送出時要回聊天室按一下，掛好之後就會自動送</span>
</div>

<main>
  <section class="screen on" id="scrForm">
    <!-- 「你還沒有叫貨權限」那張白框拿掉（軒徹 2026-09-16 03:19 msg 24540）：
         同一件事橫幅已經講過一次，白框是第二次，讀起來像被唸兩遍。 -->

    <div class="card">
      <label for="store">1. 選擇店鋪</label>
      <!-- 🔴 2026-09-20 msg25495／25496（他附了 ERP〈門市資訊〉截圖，原話「這些門市都要上」）：
           補上 0000 中轉倉、1001 鴻海、1002 中科、1003 享時蔬，**順序照他截圖＝ERP 門市資訊的順序**
           （⛔ 不是舊版那個配送路線序，2008 因此從 2004 後面移到 2007 後面）。
           🔴 2026-09-20 msg25498「改　要連」⇒ **下面這 12 個 option 已經不是主清單了**，
              它是 `GET /xq/stores` 連不到時的**備援**（見下方 `loadStores()`）。
              ⇒ 正常情況下它們一開頁就會被現撈的結果整批換掉；
              ⛔ 所以**不要再靠手改這裡來新增門市**——改 ERP〈門市資訊〉就會生效。
              （這份備援本身還是會過期，但過期時頁面會亮警語，不是無聲的。） -->
      <select id="store">
        <option value="">請選擇</option>
        <option value="2001">台北江南店</option>
        <option value="2002">台北瑞湖店</option>
        <option value="2003">台北昆陽店</option>
        <option value="2004">新北中和店</option>
        <option value="2005">台中逢甲店</option>
        <option value="2006">台北錦州店</option>
        <option value="2007">台南永華店</option>
        <option value="2008">汐止中興店</option>
        <option value="0000">中轉倉(新莊央廚)</option>
        <option value="1001">益循鴻海店</option>
        <option value="1002">益循中科店</option>
        <option value="1003">享時蔬台中站前店</option>
      </select>
      <!-- 連不到後端時才出現。⛔ 不要拿掉：沒有這一行，降級就是靜默的。 -->
      <div id="storeWarn" style="display:none;margin-top:6px;font-size:13px;color:#b45309;">
        目前連不到系統，這份店鋪清單可能不是最新的。找不到你的店就先別送，跟採購人員說一聲。
      </div>

      <label for="name">2. 姓名</label>
      <input id="name" type="text" autocomplete="name" placeholder="王曉明">

      <label for="phone">3. 電話</label>
      <input id="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="0912345678">

      <div class="err" id="err"></div>
      <button class="primary" id="submitBtn">4. 送出申請</button>
      <div class="note">一個人要綁多間店，就分別申請多次。</div>
    </div>
  </section>

  <!-- 等待認證：送出之後停在這一頁（軒徹 2026-09-16 01:05 msg 24485 要的） -->
  <section class="screen" id="scrWait">
    <div class="card done">
      <div class="big" id="waitIcon">🕒</div>
      <h2 id="waitTitle">等待認證</h2>
      <p class="note" id="waitBody">你的申請已經送出，等管理員核准。</p>

      <div class="kv">
        <div><span>店鋪</span><span id="kvStore">—</span></div>
        <div><span>姓名</span><span id="kvName">—</span></div>
        <div><span>電話</span><span id="kvPhone">—</span></div>
      </div>

      <div class="kv">
        <div class="step ok"   id="st1"><span class="dot">✓</span><span>填寫資料</span></div>
        <div class="step now"  id="st2"><span class="dot">2</span><span>送出申請</span></div>
        <div class="step todo" id="st3"><span class="dot">3</span><span>管理員核准</span></div>
        <div class="step todo" id="st4"><span class="dot">4</span><span>開通叫貨</span></div>
      </div>

      <!-- 沒有 LIFF 時才會出現：要使用者回聊天室按一下送出 -->
      <div id="manualBox" style="display:none">
        <div class="warn">
          <b>還差最後一步。</b>按下面這顆會跳回聊天室，訊息已經幫你打好了，<b>你只要按送出</b>。
          （等這個申請頁正式掛進 LINE 之後，這一步就會自動完成。）
        </div>
        <a class="primary" id="manualBtn" href="#"
           style="display:block;text-align:center;text-decoration:none">回聊天室送出</a>
      </div>

      <div class="note" id="waitFoot" style="margin-top:14px"></div>
    </div>
  </section>

  <section class="screen" id="scrDone">
    <div class="card done">
      <div class="big">✅</div>
      <h2 id="doneTitle">已送出</h2>
      <p class="note" id="doneBody"></p>
    </div>
  </section>
</main>

<script>
// ─── 送出管道：不靠 Apps Script，把申請變成一則 LINE 訊息丟給機器人 ─────────────
// 🔴 為什麼不是 fetch 後端：本頁是 GitHub Pages（https 靜態），沒有自己的後端；
//    Apps Script 要軒徹本人部署才有 /exec，卡在他手上。改走 LINE 這條就不依賴他。
// 兩條路，能走哪條看「這頁是不是真的掛成 LIFF」：
//   A 真 LIFF（LIFF_ID 有填且 init 成功）→ liff.sendMessages() 直接代送，使用者不用多按。
//   B 沒 LIFF（現況）→ 跳 LINE 官方帳號深連結，訊息預先打好，使用者按一下送出。
// ⇒ B 現在就能用，A 等拿到 LIFF ID 填進去就自動升級，**頁面其他地方一行都不用改**。
// 哲安 2026-09-16 09:49 給（LINE Login channel「叫貨LIFF」底下的 LIFF app「享奇雞申請認證」）。
// 驗過才填：GET https://liff.line.me/2011621834-9piDKflF → 200 且 og:title=「享奇雞申請認證」；
//          負控 同 channel 前綴的假 ID 2011621834-00000000 → 404。⇒ 這串是真的、已 Published。
var LIFF_ID  = "2011621834-9piDKflF";
// 🔴 光填這裡**不會**讓 A 路生效：liff.init 只有在頁面是從 `liff.line.me/{ID}` 開的才會成功。
//    若使用者仍從 https://posiloop.github.io/... 直接開，init 失敗 → 靜默退回 B 路（就是原本的行為）。
//    ⇒ 要真的走 A，LINE 那顆「申請認證」按鈕的 uri 也要改成 liff.line.me（見 xq_line_adapter.APPLY_URL）。
var BOT_ID   = "@040xpvza";        // 叫貨機器人（GET /v2/bot/info 實查：displayName「叫貨機器人」）
// 🔴 C 路的後端：機器人自己那條 cloudflared 隧道（本來就通，健康檢查 /xq/health 200）。
//    ⛔ 這不是 Apps Script，不需要任何人去部署。
var ENDPOINT = "https://hook.aemassinc.net/xq/apply";

// ─── 身分從網址帶進來（軒徹 2026-09-16 01:47 msg 24502：「按送出就送出」）─────────
// 🔴 這就是「不必等 LIFF ID」的關鍵：這頁的網址是**機器人在回覆某個人的當下**產的，
//    那一刻它就知道按的人是誰 ⇒ 身分直接寫進 query，附 HMAC 簽章防冒名。
//    ⛔ 不要把「有沒有 LIFF」跟「送不送得出去」綁在一起——那是 01:26 我判斷錯的地方。
// 🔴 從 liff.line.me/{ID}?u=..&s=.. 進來時，LINE **不會**把 query 原樣傳過來，
//    而是包成 `?liff.state=%3Fu%3D..%26s%3D..`（2026-09-16 11:2x 實測：
//    `curl https://liff.line.me/2011621834-9piDKflF?u=TESTUID&s=TESTSIG` 回的 HTML 裡就是這個形狀）。
//    SDK 會在 init 之後把它還原，但那是**非同步**的，而 Q_UID／橫幅在 script 載入當下就要讀值
//    ⇒ 不自己先解一次的話，改走真 LIFF 反而比原本的普通網頁**更糟**：
//      橫幅會先閃一次「這個連結沒有帶身分」，C 路也可能在還原前就被判成沒身分。
function rawQuery(){
  var s = window.location.search || "";
  var m = /[?&]liff\.state=([^&]*)/.exec(s);
  return m ? decodeURIComponent(m[1]) : s;   // 解出來是 "?u=..&s=.."，前導 ? 讓下面的 [?&] 命中
}
function qs(k){
  var m = new RegExp("[?&]" + k + "=([^&]*)").exec(rawQuery());
  return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : "";
}
var Q_UID = qs("u"), Q_SIG = qs("s");
// 🔴 橫幅要說**這一次**的實況，不是說這個功能的一般狀況。
//    舊文案在帶了身分時是錯的，而使用者只會看到橫幅，不會去看我在群組講了什麼。
(function(){
  var b = document.getElementById("bannerTxt");
  if (!b) return;
  b.innerHTML = (Q_UID && Q_SIG)
    ? "叫貨權限未開通，填妥資料送出後等待管理員確認開通"   // 軒徹 msg 24540 指定，逐字照用
    : "<b>這個連結沒有帶身分</b>·多半是從舊訊息點進來的。回 LINE 重按一次「叫貨」再點「申請認證」就不用回聊天室了";
})();

var $ = function(id){ return document.getElementById(id); };
var lineUserId = "";
var liffReady  = false;

// ─── 店鋪清單現撈（軒徹 2026-09-20 msg25498「改　要連」）────────────────────────
// 🔴 為什麼還留著 HTML 裡那 12 個 <option>：那是**連不到時的備援**，不是忘了刪。
//    我在 msg25497 跟他講的代價是「後端掛掉選單會整個空白」，他說要連——
//    但「要連」跟「連不到就擺爛」是兩件事。備援留著，最壞情況退回今天的行為，不會更糟。
// 🔴 ⛔ 但**不准靜默退回**：退回時把警語顯示出來。
//    靜默退回 ＝ 清單悄悄過期，而過期正是這條要修的病 ⇒ 修完卻讓病無聲復發，比沒修還糟。
// 🔴 只接受「ok 且 stores 是非空陣列」才覆蓋。⛔ 不可用 `j.stores || []` 這種寫法：
//    後端若哪天回了空陣列，那句會安靜地把選單清空（[[f-nil-to-empty]] 同型）。
var STORES_URL = "https://hook.aemassinc.net/xq/stores";
(function loadStores(){
  var sel = $("store");
  if (!sel || !window.fetch) return;                 // 舊瀏覽器：留著寫死那份，照樣能用
  fetch(STORES_URL, { cache: "no-store" })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      if (!j || !j.ok || !(j.stores instanceof Array) || !j.stores.length) throw 0;
      var cur = sel.value;
      sel.innerHTML = "";
      var o0 = document.createElement("option");
      o0.value = ""; o0.textContent = "請選擇";
      sel.appendChild(o0);
      for (var i = 0; i < j.stores.length; i++) {
        var s = j.stores[i];
        if (!s || !s.no || !s.name) continue;         // 缺格就跳過，不要生出空白選項
        var o = document.createElement("option");
        o.value = s.no; o.textContent = s.name;
        sel.appendChild(o);
      }
      sel.value = cur;                                // 撈完把使用者已經選的那家選回來
    })
    .catch(function(){
      var w = $("storeWarn");
      if (w) w.style.display = "block";               // 看得見的降級，不是靜默
    });
})();

if (LIFF_ID && window.liff) {
  try {
    liff.init({ liffId: LIFF_ID })
      .then(function(){
        liffReady = true;
        $("demoBar").style.display = "none";
        return liff.isLoggedIn() ? liff.getProfile() : null;
      })
      .then(function(p){ if (p) lineUserId = p.userId || ""; })
      .catch(function(){ liffReady = false; });   // 失敗就退回 B，不擋使用者
  } catch (e) { liffReady = false; }
}

function show(id){
  var xs = document.querySelectorAll(".screen");
  for (var i = 0; i < xs.length; i++) xs[i].classList.remove("on");
  $(id).classList.add("on");
  window.scrollTo(0, 0);
}

// 機器人端靠開頭這行認出申請單（xq_line_adapter.APPLY_INTAKE_HEAD）。
// 排版成人看得懂的樣子：軒徹在聊天室裡會直接看到這則。
function applyText(a){
  return "【申請認證】\n"
       + "店鋪：" + a.storeName + "(" + a.storeNo + ")\n"
       + "姓名：" + a.name + "\n"
       + "電話：" + a.phone;
}

function toWait(a, sent, code, why){
  $("kvStore").textContent = a.storeName;
  $("kvName").textContent  = a.name;
  $("kvPhone").textContent = a.phone;
  if (sent) {
    $("st2").className = "step ok";  $("st2").firstChild.textContent = "✓";
    $("st3").className = "step now"; $("st3").firstChild.textContent = "3";
    $("waitBody").textContent = "你的申請已經送出，等管理員核准。"
                              + (code ? "（代碼 " + code + "）" : "");
    $("waitFoot").textContent = "核准之後機器人會在聊天室通知你，那時候按「叫貨」就能用了。";
    $("manualBox").style.display = "none";
  } else {
    $("waitBody").textContent = "資料填好了，還差最後一步才會送到管理員那邊。"
                              + (why ? "（" + why + "）" : "");
    $("waitFoot").textContent = "";
    $("manualBox").style.display = "block";
  }
  show("scrWait");
}

$("submitBtn").onclick = function(){
  var storeSel  = $("store");
  var storeNo   = storeSel.value;
  var storeName = storeNo ? storeSel.options[storeSel.selectedIndex].text : "";
  var name  = $("name").value.trim();
  var phone = $("phone").value.trim().replace(/[^0-9]/g, "");

  if (!storeNo)        return fail("請先選擇店鋪。");
  if (name.length < 2) return fail("請填姓名。");
  if (phone.length < 8) return fail("電話看起來不完整，請再確認。");
  $("err").style.display = "none";

  var a = { storeNo: storeNo, storeName: storeName, name: name, phone: phone };
  var text = applyText(a);

  // A：真 LIFF —— 代送，然後停在「等待認證」頁
  // 🔴 **只有在網址沒帶身分時才走這條**（2026-09-20 01:0x 修，軒徹 msg25447「無法送出申請」）。
  //    原本 A 排在 C 前面，於是**網址明明帶了簽章、卻還是先去試 LIFF 代送**：
  //    從一般網址（非 liff.line.me）開啟時 `liff.init` 仍可能成功 ⇒ `liffReady=true`
  //    ⇒ 走 A ⇒ `sendMessages` 在這個 context 下送不出去 ⇒ `.catch` → `toWait(a,false)`
  //    ⇒ 使用者看到「請手動複製」而**後端一個請求都沒收到**（log 實查：零筆 `/xq/apply`）。
  //    ⛔ 不要把這個條件拿掉：C 路（帶簽章直接 POST）是**確定可用**的那條，
  //       A 路依賴 LIFF context ⇒ **確定可用的要排前面**。
  if (!(Q_UID && Q_SIG && ENDPOINT)
      && liffReady && liff.isApiAvailable && liff.isApiAvailable("sendMessages")) {
    $("submitBtn").disabled = true;
    liff.sendMessages([{ type: "text", text: text }])
      .then(function(){ toWait(a, true); })
      .catch(function(){
        $("submitBtn").disabled = false;
        toWait(a, false);          // 代送失敗也不卡住，退回 B
      });
    return;
  }

  // C：網址帶了簽過名的身分 —— 直接打後端，使用者不用再按任何東西。
  //    🔴 失敗一律退回 B 並**說出原因**，⛔ 不可假裝送出了（那比多按一下嚴重得多）。
  if (Q_UID && Q_SIG && ENDPOINT) {
    $("submitBtn").disabled = true;
    $("submitBtn").textContent = "送出中…";
    fetch(ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ u: Q_UID, s: Q_SIG, text: text })
    }).then(function(r){
      return r.json().catch(function(){ return { ok: false, error: "http-" + r.status }; });
    }).then(function(j){
      $("submitBtn").disabled = false;
      $("submitBtn").textContent = "4. 送出申請";
      if (j && j.ok) {
        if (j.handled === "apply-already-has-store") return fail(a.storeName + "你已經有權限了，不用再申請。");
        if (j.handled === "apply-duplicate")         return fail("你上一張申請還在等核准，不用重複送。");
        return toWait(a, true, j.code);
      }
      manualFallback(a, text, "後端沒收下（" + ((j && j.error) || "未知") + "）");
    }).catch(function(e){
      $("submitBtn").disabled = false;
      $("submitBtn").textContent = "4. 送出申請";
      manualFallback(a, text, "連不到後端");
    });
    return;
  }

  // B：沒 LIFF、網址也沒帶身分 —— 退回「回聊天室按送出」那條
  //    🔴 原因一定要寫出來：不寫的話畫面跟「後端掛了」長得一模一樣，人會回報錯的症狀。
  manualFallback(a, text, "這個連結沒帶身分，回 LINE 重按一次「叫貨」就不用這步");
};

function manualFallback(a, text, why){
  // ⚠️ BOT_ID 不可 encodeURIComponent：`@` 會變 `%40`，那是路徑片段不是查詢值。
  //    只有後面的訊息本文要編碼。
  $("manualBtn").href = "https://line.me/R/oaMessage/" + BOT_ID
                      + "/?" + encodeURIComponent(text);
  toWait(a, false, "", why);
}

function fail(m){ var e = $("err"); e.textContent = m; e.style.display = "block"; }
</script>
